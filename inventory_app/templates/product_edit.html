{% extends "base.html" %}
{% block title %}编辑商品{% endblock %}
{% block page_title %}编辑商品{% endblock %}
{% block page_subtitle %}更新商品主数据，修改后会立即影响录入页和报表页。{% endblock %}
{% block hero_actions %}
<a class="btn btn-outline-dark" href="{{ url_for('main.products') }}">返回商品列表</a>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-6 col-lg-8">
    <div class="card content-card">
      <div class="card-body p-4">
        <form method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label">商品名称</label>
            <input class="form-control" name="name" value="{{ product.name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">商品类别</label>
            <input class="form-control" name="category" value="{{ product.category }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">单位</label>
            <input class="form-control" name="unit" value="{{ product.unit }}" required>
            <div class="form-text">填写数量单位，例如 件、个、箱、袋、KG。像 2000/盘 这类规格不要填在这里。</div>
          </div>
          <div class="col-12">
            <label class="form-label">默认单件毛利润</label>
            <input class="form-control" name="default_profit_per_unit" type="number" min="0" step="0.01" value="{{ product.default_profit_per_unit }}" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if product.is_active %}checked{% endif %}>
              <label class="form-check-label" for="is_active">启用商品</label>
            </div>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-dark" type="submit">保存修改</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('main.products') }}">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
